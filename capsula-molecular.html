<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Cápsula Molecular</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#04070f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Juego a pantalla completa: canvas al fondo, HUD fino arriba, mandos táctiles abajo, tarjetas modales al centro */
:root{
  --void:#04070f;
  --panel:#0b1628;
  --panel-2:#10203a;
  --plasma:#38e8ff;
  --membrane:#ff5fa2;
  --chloro:#7cff6b;
  --atp:#ffc93c;
  --danger:#ff4d5e;
  --ink:#e8f4ff;
  --muted:#8ea6c6;
  --line:rgba(56,232,255,.28);
  --fig-bg:#f4f8ff;
  --fig-ink:#1b2a44;
  --display:'Chakra Petch','Trebuchet MS',system-ui,sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--void);color:var(--ink);overflow:hidden;
  overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;font-family:var(--body)}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--atp);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- HUD ---------- */
#hud{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;
  padding-top:calc(env(safe-area-inset-top,0px) + 8px);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:6px;font-family:var(--display)}
.hrow{display:flex;align-items:center;gap:10px;justify-content:space-between;width:100%;max-width:800px;margin:0 auto}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;
  background:rgba(8,18,34,.72);border:1px solid var(--line);font-family:var(--display);
  font-size:12px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.chip b{color:var(--plasma)}
.score{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;text-shadow:0 0 12px rgba(56,232,255,.6)}
.score small{font-size:10px;letter-spacing:.14em;color:var(--muted);margin-right:6px;font-weight:600}
.tools{display:flex;gap:8px;pointer-events:auto}
.ico{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:rgba(8,18,34,.72);
  display:grid;place-items:center;padding:0}
.ico svg{width:18px;height:18px}
.meter{display:flex;align-items:center;gap:8px;flex:1;min-width:0;max-width:280px}
.meter small{font-size:10px;letter-spacing:.14em;color:var(--muted)}
.bar{flex:1;height:10px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;border:1px solid rgba(255,95,162,.4)}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff3d7a,#ff9ac4);transition:width .25s}
.bar.low i{background:linear-gradient(90deg,#ff2a2a,#ff7a3d)}
.qdots{display:flex;gap:4px;align-items:center}
.qdots small{font-size:10px;letter-spacing:.14em;color:var(--muted);margin-right:4px}
.qdots i{width:10px;height:10px;border-radius:3px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18)}
.qdots i.on{background:var(--chloro);border-color:var(--chloro);box-shadow:0 0 8px rgba(124,255,107,.7)}

/* ---------- Mandos ---------- */
#ctrls{position:fixed;left:0;right:0;bottom:0;z-index:5;pointer-events:none;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
#bReload{pointer-events:auto;display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:16px;
  background:linear-gradient(180deg,rgba(124,255,107,.22),rgba(20,60,30,.7));border:1px solid rgba(124,255,107,.6);
  font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.04em;text-align:left;line-height:1.1;touch-action:none}
#bReload small{font-weight:500;font-size:11px;color:#c9ffd0;letter-spacing:.02em}
#bReload svg{width:24px;height:24px;flex:none}
#bReload.urge{animation:urge .7s ease-in-out infinite alternate}
@keyframes urge{from{box-shadow:0 0 0 rgba(124,255,107,0)}to{box-shadow:0 0 24px rgba(124,255,107,.9);transform:scale(1.05)}}
#ammoBox{display:flex;flex-direction:column;align-items:center;font-family:var(--display);padding-bottom:6px}
#ammoBox b{font-size:34px;line-height:1;font-variant-numeric:tabular-nums;color:var(--atp);text-shadow:0 0 14px rgba(255,201,60,.7)}
#ammoBox span{font-size:10px;letter-spacing:.2em;color:var(--muted)}
#ammoBox.empty b{color:var(--danger);text-shadow:0 0 14px rgba(255,77,94,.8)}
#ammoBox.flash{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#bFire{pointer-events:auto;width:96px;height:96px;border-radius:50%;flex:none;touch-action:none;
  background:radial-gradient(circle at 35% 30%,#bff7ff,#38e8ff 35%,#0a5a8a 80%);border:3px solid rgba(255,255,255,.6);
  box-shadow:0 0 24px rgba(56,232,255,.55),inset 0 -6px 14px rgba(0,0,0,.35);
  font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.08em;color:#04203a}
#bFire.down{transform:scale(.93);box-shadow:0 0 36px rgba(56,232,255,.9),inset 0 4px 14px rgba(0,0,0,.4)}

#toast{position:fixed;left:50%;top:28%;transform:translateX(-50%);z-index:6;pointer-events:none;
  font-family:var(--display);font-weight:700;font-size:clamp(16px,4.4vw,22px);text-align:center;
  padding:10px 18px;border-radius:14px;background:rgba(4,10,22,.78);border:1px solid var(--line);
  width:max-content;max-width:calc(100% - 32px);opacity:0;transition:opacity .25s}
#toast.show{opacity:1}

/* ---------- Modales ---------- */
.modal{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
  background:rgba(2,6,14,.62);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);
  padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:text;user-select:text}
.card{width:100%;max-width:700px;max-height:100%;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;
  background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--line);border-radius:20px;
  box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.03) inset;padding:20px;
  display:flex;flex-direction:column;gap:14px}
.card h1,.card h2,.card h3{margin:0;font-family:var(--display);text-wrap:balance}
.eyebrow{font-family:var(--display);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--plasma)}
.lead{margin:0;color:#c9d9ee;line-height:1.5;font-size:16px}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{border-radius:14px;padding:13px 18px;border:1px solid var(--line);background:rgba(255,255,255,.04);
  font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.05em}
.btn.primary{background:linear-gradient(180deg,#5ff0ff,#1b9cc9);color:#03182a;border-color:#9ff6ff;box-shadow:0 0 22px rgba(56,232,255,.35)}
.btn.go{background:linear-gradient(180deg,#9cff8a,#2fae4a);color:#062410;border-color:#c9ffbe}
.btn:disabled{opacity:.35;cursor:not-allowed}

/* Portada */
.title{font-family:var(--display);font-weight:700;line-height:.92;letter-spacing:.02em;
  font-size:clamp(40px,11vw,76px);margin:0;
  background:linear-gradient(180deg,#ffffff 10%,#9ff6ff 45%,#38e8ff 55%,#1b5fa0 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(56,232,255,.45))}
.title span{display:block;font-size:.5em;letter-spacing:.32em;background:linear-gradient(180deg,#ffd0e4,#ff5fa2);
  -webkit-background-clip:text;background-clip:text}
.phases{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.ph{display:flex;flex-direction:column;gap:2px;text-align:left;padding:10px 12px;border-radius:12px;
  border:1px solid var(--line);background:rgba(255,255,255,.03);min-width:0}
.ph b{font-family:var(--display);font-size:13px;letter-spacing:.1em;color:var(--plasma)}
.ph span{font-size:12.5px;color:#c9d9ee;line-height:1.25}
.ph.done b{color:var(--chloro)}
.ph:disabled{opacity:.38}
.small{font-size:13px;color:var(--muted);line-height:1.45;margin:0}
.link{background:none;border:none;padding:0;color:var(--muted);text-decoration:underline;font-size:13px}
.howto{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;line-height:1.45;color:#d6e4f5}
.howto b{color:var(--atp)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px;color:#c9d9ee}
.keys kbd{font-family:var(--display);font-size:12px;padding:2px 7px;border-radius:6px;border:1px solid var(--line);background:rgba(255,255,255,.05);white-space:nowrap}
.enemies{display:flex;flex-wrap:wrap;gap:8px}
.enemies span{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:13px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04)}
.enemies i{width:10px;height:10px;border-radius:50%}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stat{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}
.stat small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stat b{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}

/* Pregunta */
.qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.qtopic{font-size:13px;color:var(--muted)}
#qText{font-family:var(--body);font-weight:700;font-size:clamp(17px,4.6vw,21px);line-height:1.35}
.fig{background:var(--fig-bg);border-radius:14px;padding:8px;overflow-x:auto;flex:none}
.fig svg{width:100%;max-width:560px;height:auto;max-height:36vh;display:block;margin:0 auto}
.opts{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:620px){.opts{grid-template-columns:1fr 1fr}}
.opt{display:flex;align-items:center;gap:10px;text-align:left;padding:12px;border-radius:14px;min-height:54px;
  border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);font-size:15.5px;line-height:1.3;min-width:0}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-family:var(--display);font-weight:700;
  background:rgba(56,232,255,.15);color:var(--plasma);border:1px solid var(--line)}
.opt:not(:disabled):hover{border-color:var(--plasma);background:rgba(56,232,255,.08)}
.opt.ok{border-color:var(--chloro);background:rgba(124,255,107,.16)}
.opt.ok .k{background:var(--chloro);color:#06240f}
.opt.bad{border-color:var(--danger);background:rgba(255,77,94,.16)}
.opt.bad .k{background:var(--danger);color:#2a0006}
.opt:disabled{cursor:default}
.opt.dim{opacity:.45}
.fb{border-radius:14px;padding:12px 14px;line-height:1.45;font-size:15px}
.fb.ok{background:rgba(124,255,107,.1);border:1px solid rgba(124,255,107,.45)}
.fb.bad{background:rgba(255,77,94,.1);border:1px solid rgba(255,77,94,.45)}
.fb strong{font-family:var(--display);letter-spacing:.04em;display:block;margin-bottom:4px;font-size:16px}
@media (max-height:560px){.fig svg{max-height:44vh}.card{padding:14px;gap:10px}}
@media (prefers-reduced-motion:reduce){#bReload.urge{animation:none}}
</style>
</head>
<body>
<canvas id="game" aria-label="Juego Cápsula Molecular"></canvas>

<div id="hud" hidden>
  <div class="hrow">
    <span class="chip" id="hPhase">Fase <b>1</b></span>
    <span class="score"><small>PUNTOS</small><span id="hScore">0</span></span>
    <div class="tools">
      <button class="ico" id="bMute" aria-label="Silenciar sonido"></button>
      <button class="ico" id="bPause" aria-label="Pausa"><svg viewBox="0 0 24 24" fill="#e8f4ff"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg></button>
    </div>
  </div>
  <div class="hrow">
    <div class="meter"><small>MEMBRANA</small><div class="bar" id="hHpBar"><i id="hHp"></i></div></div>
    <div class="qdots" id="hQ"><small>PREGUNTAS</small></div>
  </div>
</div>

<div id="ctrls" hidden>
  <button id="bReload" aria-label="Responder una pregunta para recargar 15 balas">
    <svg viewBox="0 0 24 24" fill="none" stroke="#c9ffbe" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.2a2.6 2.6 0 1 1 3.6 2.4c-.7.3-1.1.9-1.1 1.6v.5"/><circle cx="12" cy="17" r=".6" fill="#c9ffbe"/></svg>
    <span>Recargar<br><small>+15 balas</small></span>
  </button>
  <div id="ammoBox"><b id="hAmmo">0</b><span>BALAS</span></div>
  <button id="bFire" aria-label="Disparar">DISPARAR</button>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<div id="screen" class="modal" hidden></div>

<div id="quiz" class="modal" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="qText">
    <div class="qhead"><span class="chip" id="qTag">Recarga</span><span class="chip" id="qCount">Correctas 0/10</span></div>
    <div class="qtopic" id="qTopic"></div>
    <h2 id="qText"></h2>
    <div class="fig" id="qFig" hidden></div>
    <div class="opts" id="qOpts"></div>
    <div class="fb" id="qFb" hidden></div>
    <button class="btn primary" id="qNext" hidden>Continuar</button>
  </div>
</div>

<script>
'use strict';
/* =========================================================
   SONIDO (sintetizado, sin archivos)
   ========================================================= */
const SFX={ctx:null,on:true,lastEmpty:0,
  init(){ if(!this.ctx){ try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
    if(this.ctx&&this.ctx.state==='suspended') this.ctx.resume(); },
  tone(f,d,type='square',v=.06,slide=0,delay=0){ if(!this.on||!this.ctx) return;
    const c=this.ctx,t=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
    g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.03); },
  noise(d,v=.18){ if(!this.on||!this.ctx) return; const c=this.ctx,len=Math.floor(c.sampleRate*d),b=c.createBuffer(1,len,c.sampleRate),a=b.getChannelData(0);
    for(let i=0;i<len;i++) a[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);
    const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain(); f.type='lowpass';f.frequency.value=900;
    s.buffer=b;g.gain.value=v;s.connect(f);f.connect(g);g.connect(c.destination);s.start(); },
  shoot(){this.tone(1100,.07,'square',.025,-700)},
  boom(big){this.noise(big?.6:.3,big?.3:.16);this.tone(140,.3,'sawtooth',.05,-90)},
  hit(){this.tone(320,.05,'square',.03,-120)},
  hurt(){this.tone(180,.25,'sawtooth',.08,-120);this.noise(.2,.12)},
  ok(){[523,659,784,1047].forEach((f,i)=>this.tone(f,.16,'triangle',.08,0,i*.08))},
  bad(){this.tone(240,.22,'sawtooth',.06,-80);this.tone(170,.3,'sawtooth',.06,-60,.16)},
  empty(){const n=performance.now(); if(n-this.lastEmpty<220) return; this.lastEmpty=n; this.tone(130,.06,'square',.05)},
  win(){[392,523,659,784,1047,1319].forEach((f,i)=>this.tone(f,.22,'triangle',.08,0,i*.11))}
};

/* =========================================================
   FIGURAS SVG PARA LAS PREGUNTAS
   ========================================================= */
const INK='#1b2a44', FONT="font-family=\"Atkinson Hyperlegible,Arial,sans-serif\"";
const svg=(vb,inner)=>`<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" role="img" ${FONT}>${inner}</svg>`;
const N=(x,y,n)=>`<g><circle cx="${x}" cy="${y}" r="11.5" fill="${INK}" stroke="#ffffff" stroke-width="2"/><text x="${x}" y="${y+4.6}" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">${n}</text></g>`;
const L=(x1,y1,x2,y2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${INK}" stroke-width="1.6"/>`;
const T=(x,y,s,size=13,anchor='middle',w=400,fill=INK)=>`<text x="${x}" y="${y}" text-anchor="${anchor}" font-size="${size}" font-weight="${w}" fill="${fill}">${s}</text>`;
const ARROW=`<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${INK}"/></marker></defs>`;
const mitoIcon=(x,y,rot,s=1)=>`<g transform="translate(${x} ${y}) rotate(${rot}) scale(${s})"><ellipse rx="30" ry="15" fill="#f6a04d" stroke="#a54a12" stroke-width="2.5"/><path d="M-22 0 l5 -9 l5 18 l5 -18 l5 18 l5 -18 l5 18 l5 -18 l4 9" fill="none" stroke="#a54a12" stroke-width="2"/></g>`;
const chloroIcon=(x,y,rot,s=1)=>`<g transform="translate(${x} ${y}) rotate(${rot}) scale(${s})"><ellipse rx="24" ry="13" fill="#4caf50" stroke="#1f6b25" stroke-width="2"/><g fill="#1f6b25"><rect x="-15" y="-6" width="7" height="12" rx="1.5"/><rect x="-3" y="-6" width="7" height="12" rx="1.5"/><rect x="9" y="-6" width="7" height="12" rx="1.5"/></g><line x1="-17" y1="0" x2="18" y2="0" stroke="#1f6b25" stroke-width="1.5"/></g>`;

function barChart(data,max,step,ylab){
  const x0=78,y0=200,h=165,w=345,bw=w/data.length; let s='';
  for(let v=0;v<=max;v+=step){const y=y0-v/max*h; s+=`<line x1="${x0}" y1="${y}" x2="${x0+w}" y2="${y}" stroke="#cdd9eb" stroke-width="1"/>`+T(x0-8,y+4,v,11,'end');}
  data.forEach((d,i)=>{const bh=d.v/max*h, x=x0+i*bw+bw*.17, bwi=bw*.66;
    s+=`<rect x="${x}" y="${y0-bh}" width="${bwi}" height="${Math.max(bh,0)}" rx="3" fill="${d.c}" stroke="${INK}" stroke-width="1"/>`;
    s+=T(x+bwi/2,y0-bh-6,d.v,12,'middle',700);
    d.l.forEach((ln,j)=>{s+=T(x+bwi/2,y0+16+j*13,ln,11);});});
  s+=`<line x1="${x0}" y1="${y0}" x2="${x0+w}" y2="${y0}" stroke="${INK}" stroke-width="1.8"/><line x1="${x0}" y1="${y0}" x2="${x0}" y2="${y0-h-8}" stroke="${INK}" stroke-width="1.8"/>`;
  s+=`<text transform="translate(18 ${y0-h/2}) rotate(-90)" text-anchor="middle" font-size="12" font-weight="700" fill="${INK}">${ylab}</text>`;
  return svg('0 0 440 240',s);
}

const FIG={
  animal(){ let s=`<path d="M70 150 C60 72 150 32 230 40 C322 46 390 92 380 160 C372 236 300 268 220 260 C130 256 78 226 70 150Z" fill="#ffe1d3" stroke="#e0607e" stroke-width="5"/>`;
    s+=`<circle cx="200" cy="150" r="48" fill="#cdb8f5" stroke="#6b4bc4" stroke-width="3"/><circle cx="212" cy="140" r="15" fill="#6b4bc4"/>`;

  cv.width=Math.round(cw*DPR); cv.height=Math.round(ch*DPR);

}

const SPR={}, GLOW={};

function buildSprites(){
  for(const k in DRAW){const R=ET[k].r,S=Math.ceil(R*2*1.75),c=mk(S*2),g=c.getContext('2d');g.scale(2,2);g.translate(S/2,S/2);
    const gl=g.createRadialGradient(0,0,R*.5,0,0,S/2);gl.addColorStop(0,hexA(ET[k].col,.35));gl.addColorStop(1,hexA(ET[k].col,0));g.fillStyle=gl;g.fillRect(-S/2,-S/2,S,S);
    DRAW[k](g,R);SPR[k]={c,S};}
  // membrana de fosfolípidos (bicapa) para los bordes
  const t=mk(40,18),g=t.getContext('2d');
  [[6,'#ff8fc0'],[34,'#ff8fc0']].forEach(([x,c])=>{const gr=g.createRadialGradient(x-1.5,7,0,x,9,6);gr.addColorStop(0,'#fff');gr.addColorStop(.4,c);gr.addColorStop(1,'#8a1550');g.fillStyle=gr;g.beginPath();g.arc(x,9,5.5,0,7);g.fill();});
  g.strokeStyle='rgba(255,210,120,.75)';g.lineWidth=1.6;[[11,7],[11,11],[29,7],[29,11]].forEach(([x,y])=>{g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x<20?16:24,y+(y<9?-2:2),20,y);g.stroke();});
  SPR.membrane=t;

/* =========================================================
   FONDO: citoplasma con profundidad (parallax)
   ========================================================= */
const PAL=[
  {top:'#021622',bot:'#06303f',blob:'#1ec8c8',acc:'#38e8ff'},
  {top:'#0e0424',bot:'#2a0b45',blob:'#a24bff',acc:'#d08cff'},
  {top:'#031a0b',bot:'#0b3a1c',blob:'#4cff7a',acc:'#9cff6b'},
  {top:'#1e030a',bot:'#470a17',blob:'#ff3d5a',acc:'#ff8a9a'},
  {top:'#1c1102',bot:'#3f2806',blob:'#ffc93c',acc:'#ffe08a'}];
const BG={blobs:[],dust:[],far:[],fil:[],scroll:0};
function initBG(){
  BG.blobs=[];for(let i=0;i<7;i++)BG.blobs.push({x:rand(0,W),y:rand(0,H),r:rand(90,230),sp:rand(6,16)});
  BG.dust=[];for(let i=0;i<70;i++)BG.dust.push({x:rand(0,W),y:rand(0,H),z:rand(.25,1)});
  BG.far=[];const ks=Object.keys(DRAW);for(let i=0;i<6;i++)BG.far.push({k:ks[i%ks.length],x:rand(0,W),y:rand(0,H),s:rand(.5,.9),rot:rand(0,6),rs:rand(-.3,.3),sp:rand(14,28)});
  BG.fil=[];for(let i=0;i<5;i++)BG.fil.push({x:rand(0,W),y:rand(-H,H),len:rand(240,520),amp:rand(20,60),sp:rand(30,50),ph:rand(0,6)});
}
function drawBG(dt){
  const p=PAL[G.phase]||PAL[0];
  const gr=ctx.createLinearGradient(0,0,0,H);gr.addColorStop(0,p.top);gr.addColorStop(1,p.bot);ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
  const gs=glowSpr(p.blob);ctx.globalCompositeOperation='lighter';
  for(const b of BG.blobs){b.y+=b.sp*dt;if(b.y-b.r>H){b.y=-b.r;b.x=rand(0,W);}ctx.globalAlpha=.13;ctx.drawImage(gs,b.x-b.r,b.y-b.r,b.r*2,b.r*2);}
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  // organelos lejanos, desenfocados por distancia
  for(const f of BG.far){f.y+=f.sp*dt;f.rot+=f.rs*dt;if(f.y>H+60){f.y=-60;f.x=rand(0,W);}const s=SPR[f.k];if(!s)continue;
    ctx.save();ctx.globalAlpha=.16;ctx.translate(f.x,f.y);ctx.rotate(f.rot);const w=s.S*f.s;ctx.drawImage(s.c,-w/2,-w/2,w,w);ctx.restore();}
  // citoesqueleto
  ctx.strokeStyle=hexA(p.acc,.10);ctx.lineWidth=3;
  for(const f of BG.fil){f.y+=f.sp*dt;if(f.y>H+40){f.y=-f.len-40;f.x=rand(0,W);}ctx.beginPath();
    for(let i=0;i<=12;i++){const yy=f.y+i/12*f.len,xx=f.x+Math.sin(i*.6+f.ph)*f.amp;i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy);}ctx.stroke();}
  // partículas
  ctx.fillStyle=hexA(p.acc,.55);
  for(const d of BG.dust){d.y+=(30+d.z*170)*dt;if(d.y>H){d.y=-4;d.x=rand(0,W);}const s=d.z*2.2;ctx.globalAlpha=.25+d.z*.5;
    if(d.z>.8)ctx.fillRect(d.x,d.y,1.4,s*5);else ctx.fillRect(d.x,d.y,s,s);}
  ctx.globalAlpha=1;
  // bicapa lipídica en los bordes del campo de juego
  BG.scroll=(BG.scroll+60*dt)%18;
  if(!BG.pat) BG.pat=ctx.createPattern(SPR.membrane,'repeat-y');
  const edge=(x)=>{ctx.save();ctx.translate(x,BG.scroll-18);ctx.fillStyle=BG.pat;ctx.fillRect(0,0,40,H+36);ctx.restore();};
  if(PX0>40){ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(0,0,PX0-40,H);ctx.fillRect(PX0+PW+40,0,W,H);edge(PX0-40);edge(PX0+PW);}
  else{ctx.globalAlpha=.7;edge(-22);edge(W-18);ctx.globalAlpha=1;}
}
function drawVignette(){const v=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.75);
  v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.55)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H);}

/* =========================================================
   ESTADO DEL JUEGO
   ========================================================= */
let state='menu', player=null;
let enemies=[], bullets=[], ebullets=[], parts=[], texts=[];
const G={phase:0,score:0,phaseStartScore:0,ammo:0,hp:100,correct:0,queue:[],wrongIds:new Set(),wrongTotal:0,kills:0,
  time:0,shake:0,spawnT:1.5,emptyT:0,fireCD:0,endT:0,finalNotice:false,firstTry:0,stats:[]};
let unlocked=store.get('cm_unlocked',1), best=store.get('cm_best',0), teacher=false;

function newPlayer(){return{x:PX0+PW/2,y:maxY()-20,r:15,inv:0,tilt:0,vx:0,dead:false};}

/* ---------- Enemigos ---------- */
function diff(){return 1+G.phase*.2;}
function spawnGroup(){
  const pool=PHASES[G.phase].enemies, maxE=7+G.phase*2;
  if(enemies.length>=maxE) return;
  const k=pool[Math.floor(Math.random()*pool.length)], d=ET[k], r=Math.random();
  const L=PX0+40, Rr=PX0+PW-40;
  if(k==='nucleo'||k==='vacuola'){ addEnemy(k,rand(L+30,Rr-30),-50,'drift',{amp:rand(30,70)}); if(k==='vacuola'&&Math.random()<.5) addEnemy(k,rand(L,Rr),-140,'drift',{amp:40}); return; }
  if(r<.35){ const n=3+Math.floor(Math.random()*2+G.phase*.4), span=Math.min(PW-100,n*70), x0=PX0+PW/2-span/2+rand(-30,30);
    for(let i=0;i<n;i++) addEnemy(k,x0+i*span/(n-1),-40-Math.abs(i-(n-1)/2)*34,'drift',{amp:24}); }
  else if(r<.7){ const x0=rand(L+80,Rr-80), n=4+Math.floor(G.phase*.5);
    for(let i=0;i<n;i++) addEnemy(k,x0,-40-i*48,'sine',{amp:rand(70,120),ph:i*.5}); }
  else { const n=1+Math.floor(Math.random()*(1+G.phase*.5)); for(let i=0;i<n;i++) addEnemy(k,rand(L,Rr),-40-i*60,'dive',{}); }
}
function addEnemy(k,x,y,move,o){
  const d=ET[k], df=diff();
  enemies.push({k,def:d,x,y,x0:x,move,hp:Math.ceil(d.hp*(G.phase>=3&&d.hp>1?1.25:1)),t:rand(0,1),
    amp:o.amp||40,ph:o.ph||rand(0,6),f:rand(1.2,2.2),vy:d.spd*(.85+G.phase*.08),vx:0,
    rot:rand(-.4,.4),rs:rand(-.8,.8),flash:0,fireT:rand(.8,2.4)/df,hold:rand(.9,1.8),ty:rand(H*.12,H*.32),locked:false});
}
function enemyFire(e){
  const d=e.def, sp=(220+G.phase*22), ang=Math.atan2(player.y-e.y,player.x-e.x);
  const shot=(a,s,col,r=5)=>ebullets.push({x:e.x,y:e.y+d.r*.5,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r,col});
  if(d.shot==='atp') shot(Math.PI/2,sp,'#ffc93c');
  else if(d.shot==='spread') [-.32,0,.32].forEach(o=>shot(Math.PI/2+o,sp*.85,'#ff6fa8',6));
  else if(d.shot==='aim') shot(ang,sp*1.15,'#7cff6b');
  else if(d.shot==='burst') [-.16,0,.16].forEach(o=>shot(ang+o,sp,'#c9a8ff',6));
}
function updateEnemies(dt,attract){
  for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];e.t+=dt;e.rot+=e.rs*dt;if(e.flash>0)e.flash-=dt;
    if(e.move==='drift'){e.y+=e.vy*dt;e.x=e.x0+Math.sin(e.t*e.f+e.ph)*e.amp;}
    else if(e.move==='sine'){e.y+=e.vy*.9*dt;e.x=e.x0+Math.sin(e.t*2.2+e.ph)*e.amp;}
    else if(e.move==='dive'){
      if(e.t<e.hold){e.y+=(e.ty-e.y)*Math.min(1,dt*2.4);e.x=e.x0+Math.sin(e.t*3)*26;}
      else{if(!e.locked){e.locked=true;const tx=attract?e.x:player.x,ty=attract?H:player.y;const dx=tx-e.x,dy=ty-e.y,dd=Math.hypot(dx,dy)||1,s=e.def.spd*2.6;e.vx=dx/dd*s;e.vy=Math.abs(dy/dd*s)+40;}
        e.x+=e.vx*dt;e.y+=e.vy*dt;}}
    if(e.y>H+70||e.x<-120||e.x>W+120){enemies.splice(i,1);continue;}
    if(!attract&&e.def.fire&&e.y>10&&e.y<H*.62){e.fireT-=dt;if(e.fireT<=0){e.fireT=(1/(e.def.fire*diff()))*rand(.6,1.4);enemyFire(e);}}
  }
}

/* ---------- Efectos ---------- */
function burst(x,y,col,n,spd,life,size){for(let i=0;i<n;i++){const a=rand(0,Math.PI*2),s=rand(spd*.3,spd);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(life*.5,life),max:life,size:rand(size*.5,size),col,t:'s'});}}
function explode(x,y,col,big){burst(x,y,col,big?40:22,big?320:220,.7,big?16:11);burst(x,y,'#ffffff',8,120,.35,8);
  parts.push({x,y,life:.45,max:.45,size:big?90:52,col,t:'r'});parts.push({x,y,life:.25,max:.25,size:big?140:80,col,t:'f'});
  G.shake=Math.max(G.shake,big?14:5);SFX.boom(big);}
function floatText(x,y,txt,col){texts.push({x,y,txt,col,life:1.1});}
let toastT=null;
function toast(msg,ms=1800){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),ms);}

/* ---------- Disparo del jugador ---------- */
let fireHeld=false;
function tryFire(){
  if(G.fireCD>0) return;
  if(G.ammo<=0){SFX.empty();const a=$('ammoBox');a.classList.remove('flash');void a.offsetWidth;a.classList.add('flash');G.fireCD=.25;return;}
  G.ammo--;G.fireCD=.15;bullets.push({x:player.x,y:player.y-30,vy:-920});SFX.shoot();hud();
}

/* ---------- Bucle principal ---------- */
function update(dt){
  G.time+=dt; if(G.fireCD>0)G.fireCD-=dt; if(G.shake>0)G.shake=Math.max(0,G.shake-dt*30);
  if(state==='menu'){ G.spawnT-=dt; if(G.spawnT<=0){G.spawnT=rand(.8,1.6); if(enemies.length<10){const ks=Object.keys(ET),k=ks[Math.floor(Math.random()*ks.length)];addEnemy(k,rand(PX0+40,PX0+PW-40),-50,Math.random()<.5?'drift':'sine',{amp:rand(30,90)});}}
    updateEnemies(dt,true); updateParts(dt); return; }
  if(state!=='play'&&state!=='dying'&&state!=='ending'){ return; }
  updateParts(dt);
  if(state==='dying'){G.endT-=dt;updateEnemies(dt,true);if(G.endT<=0)gameOver();return;}
  if(state==='ending'){G.endT-=dt;if(G.endT<=0)phaseClear();return;}

  // movimiento por teclado
  const p=player; let mx=0,my=0;
  if(keys.ArrowLeft||keys.KeyA)mx-=1; if(keys.ArrowRight||keys.KeyD)mx+=1; if(keys.ArrowUp||keys.KeyW)my-=1; if(keys.ArrowDown||keys.KeyS)my+=1;
  p.x+=mx*430*dt; p.y+=my*430*dt;
  p.x=clamp(p.x,PX0+22,PX0+PW-22); p.y=clamp(p.y,H*.3,maxY());
  p.vx=(p.x-p.lastx||0)/Math.max(dt,.001); p.lastx=p.x; p.tilt+=(clamp(p.vx/900,-.35,.35)-p.tilt)*Math.min(1,dt*10);
  if(p.inv>0)p.inv-=dt;
  if(fireHeld||keys.Space) tryFire();

  // generación de oleadas
  G.spawnT-=dt; if(G.spawnT<=0){G.spawnT=Math.max(.75,1.9-G.phase*.2)*rand(.75,1.25);spawnGroup();}
  updateEnemies(dt,false);

  // balas del jugador
  for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.y+=b.vy*dt;if(b.y<-20){bullets.splice(i,1);continue;}
    for(let j=enemies.length-1;j>=0;j--){const e=enemies[j],hr=e.def.r*(e.k==='mitocondria'||e.k==='cloroplasto'?1.15:1)+4;
      if(Math.abs(b.x-e.x)<hr&&Math.abs(b.y-e.y)<hr&&Math.hypot(b.x-e.x,b.y-e.y)<hr){
        bullets.splice(i,1);e.hp--;e.flash=.12;burst(b.x,b.y,e.def.col,5,140,.3,6);SFX.hit();
        if(e.hp<=0){enemies.splice(j,1);const pts=Math.round(e.def.pts*(1+G.phase*.25));G.score+=pts;G.kills++;
          explode(e.x,e.y,e.def.col,e.def.r>=30);floatText(e.x,e.y-e.def.r,`+${pts} ${e.def.name}`,e.def.col);hud();}
        break;}}}
  // balas enemigas
  for(let i=ebullets.length-1;i>=0;i--){const b=ebullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.y>H+20||b.y<-30||b.x<-20||b.x>W+20){ebullets.splice(i,1);continue;}
    if(p.inv<=0&&Math.hypot(b.x-p.x,b.y-p.y)<b.r+p.r*.75){ebullets.splice(i,1);damage(12);}}
  // choque con organelos
  if(p.inv<=0) for(let j=enemies.length-1;j>=0;j--){const e=enemies[j];if(Math.hypot(e.x-p.x,e.y-p.y)<e.def.r*.85+p.r){
      damage(25);if(e.k==='nucleo'){e.hp-=2;e.flash=.2;if(e.hp<=0){enemies.splice(j,1);explode(e.x,e.y,e.def.col,true);}}else{enemies.splice(j,1);explode(e.x,e.y,e.def.col,false);}break;}}

  // munición agotada → pregunta automática
  if(G.ammo<=0&&bullets.length===0){
    if(G.correct<10){G.emptyT+=dt;$('bReload').classList.add('urge');if(G.emptyT>1.1){G.emptyT=0;openQuiz();}}
    else {state='ending';G.endT=1.2;enemies.forEach(e=>explode(e.x,e.y,e.def.col,false));enemies=[];ebullets=[];}
  } else {G.emptyT=0;$('bReload').classList.remove('urge');}
}
function damage(n){const p=player;G.hp=Math.max(0,G.hp-n);p.inv=1.1;G.shake=12;SFX.hurt();burst(p.x,p.y,'#ff5fa2',14,200,.5,9);hud();
  if(G.hp<=0){p.dead=true;explode(p.x,p.y,'#38e8ff',true);explode(p.x,p.y,'#ff5fa2',true);state='dying';G.endT=1.4;fireHeld=false;}}
function updateParts(dt){
  for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.life-=dt;if(q.life<=0){parts.splice(i,1);continue;}if(q.t==='s'){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.96;q.vy*=.96;}}
  for(let i=texts.length-1;i>=0;i--){const t=texts[i];t.life-=dt;t.y-=40*dt;if(t.life<=0)texts.splice(i,1);}
}

/* ---------- Dibujo ---------- */
function drawEnemy(e){
  ctx.save();ctx.translate(e.x,e.y);
  if(e.k==='adn') drawADN(e);
  else{const s=SPR[e.k];ctx.rotate(e.rot);ctx.drawImage(s.c,-s.S/2,-s.S/2,s.S,s.S);
    if(e.flash>0){ctx.globalCompositeOperation='lighter';ctx.globalAlpha=Math.min(1,e.flash*8);ctx.drawImage(s.c,-s.S/2,-s.S/2,s.S,s.S);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';}
    ctx.rotate(-e.rot);}
  ctx.font='600 11px "Chakra Petch",sans-serif';ctx.textAlign='center';ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillText(e.def.name,1,e.def.r+15);
  ctx.fillStyle='rgba(255,255,255,.82)';ctx.fillText(e.def.name,0,e.def.r+14);
  ctx.restore();
}
function drawADN(e){
  const R=e.def.r,Lh=R*2.6,Nn=12;ctx.rotate(Math.sin(e.t*1.3)*.35);
  ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.5;const g=glowSpr(e.def.col);ctx.drawImage(g,-R*1.6,-Lh*.75,R*3.2,Lh*1.5);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  const pts=[];for(let i=0;i<=Nn;i++){const ph=e.t*4+i*.62;pts.push({y:-Lh/2+i*Lh/Nn,x:Math.sin(ph)*R*.72,z:Math.cos(ph)});}
  ctx.lineWidth=2.6;pts.forEach((q,i)=>{ctx.strokeStyle=i%2?'#ffd54a':'#52e3ff';ctx.beginPath();ctx.moveTo(q.x,q.y);ctx.lineTo(-q.x,q.y);ctx.stroke();});
  const strand=(sgn,col)=>{ctx.strokeStyle=col;ctx.lineWidth=4.5;ctx.lineCap='round';ctx.beginPath();pts.forEach((q,i)=>{const x=q.x*sgn;i?ctx.lineTo(x,q.y):ctx.moveTo(x,q.y);});ctx.stroke();
    pts.forEach(q=>{const z=q.z*sgn,r=3+z*1.3;const gr=ctx.createRadialGradient(q.x*sgn-1,q.y-1,0,q.x*sgn,q.y,r+1);gr.addColorStop(0,'#fff');gr.addColorStop(.5,col);gr.addColorStop(1,'#20103a');ctx.fillStyle=gr;ctx.beginPath();ctx.arc(q.x*sgn,q.y,Math.max(1.5,r),0,7);ctx.fill();});};
  strand(-1,'#7a8cff');strand(1,'#ff5fa2');
  if(e.flash>0){ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.7;ctx.drawImage(g,-R*1.4,-Lh*.6,R*2.8,Lh*1.2);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';}
}
function pill(g,x,y,w,h){const r=w/2;g.beginPath();g.moveTo(x,y+r);g.arc(x+r,y+r,r,Math.PI,0);g.lineTo(x+w,y+h-r);g.arc(x+r,y+h-r,r,0,Math.PI);g.closePath();}
function drawPlayer(){
  const p=player;if(!p||p.dead)return;
  ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.tilt);
  if(p.inv>0&&Math.floor(p.inv*16)%2)ctx.globalAlpha=.45;
  // propulsor
  const fl=1+Math.sin(G.time*42)*.12+Math.random()*.12;ctx.globalCompositeOperation='lighter';
  let gr=ctx.createRadialGradient(0,30,0,0,36,24*fl);gr.addColorStop(0,'rgba(220,255,255,.95)');gr.addColorStop(.35,'rgba(56,232,255,.6)');gr.addColorStop(1,'rgba(0,60,255,0)');
  ctx.fillStyle=gr;ctx.beginPath();ctx.ellipse(0,40,9*fl,24*fl,0,0,7);ctx.fill();
  ctx.drawImage(glowSpr('#38e8ff'),-34,-40,68,90);ctx.globalCompositeOperation='source-over';
  // aletas
  gr=ctx.createLinearGradient(-26,0,26,0);gr.addColorStop(0,'#7a1046');gr.addColorStop(.5,'#ff8fc0');gr.addColorStop(1,'#7a1046');ctx.fillStyle=gr;
  ctx.beginPath();ctx.moveTo(-12,2);ctx.lineTo(-27,24);ctx.lineTo(-23,30);ctx.lineTo(-11,22);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(12,2);ctx.lineTo(27,24);ctx.lineTo(23,30);ctx.lineTo(11,22);ctx.closePath();ctx.fill();
  // cuerpo (cápsula metálica)
  gr=ctx.createLinearGradient(-14,0,14,0);gr.addColorStop(0,'#24324f');gr.addColorStop(.22,'#9fb4d4');gr.addColorStop(.42,'#ffffff');gr.addColorStop(.68,'#8aa0c4');gr.addColorStop(1,'#18233c');
  ctx.fillStyle=gr;pill(ctx,-14,-31,28,60);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=1;ctx.stroke();
  // mitad inferior color (como cápsula de medicamento)
  ctx.save();pill(ctx,-14,-31,28,60);ctx.clip();gr=ctx.createLinearGradient(-14,0,14,0);gr.addColorStop(0,'#5a0a30');gr.addColorStop(.42,'#ff9ac4');gr.addColorStop(1,'#4a0826');
  ctx.fillStyle=gr;ctx.fillRect(-14,6,28,30);ctx.fillStyle='rgba(56,232,255,.9)';ctx.fillRect(-14,4,28,3);ctx.restore();
  // cabina de vidrio
  gr=ctx.createRadialGradient(-3,-19,1,0,-14,12);gr.addColorStop(0,'#eaffff');gr.addColorStop(.4,'#38c8ff');gr.addColorStop(1,'#062a5c');
  ctx.fillStyle=gr;ctx.beginPath();ctx.ellipse(0,-14,8.5,11,0,0,7);ctx.fill();spec(ctx,-3,-19,4,2.4,.9);
  ctx.restore();
  if(p.inv>0){ctx.strokeStyle=`rgba(56,232,255,${Math.min(.6,p.inv)})`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,34,0,7);ctx.stroke();}
}
function render(){
  ctx.setTransform(DPR*scale,0,0,DPR*scale,0,0);
  const sx=G.shake?rand(-G.shake,G.shake)*.5:0, sy=G.shake?rand(-G.shake,G.shake)*.5:0;
  ctx.translate(sx,sy);
  drawBG(lastDt);
  for(const e of enemies) drawEnemy(e);
  // balas enemigas
  ctx.globalCompositeOperation='lighter';
  for(const b of ebullets){ctx.drawImage(glowSpr(b.col),b.x-b.r*3,b.y-b.r*3,b.r*6,b.r*6);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,b.r*.55,0,7);ctx.fill();}
  // balas del jugador
  const bg=glowSpr('#38e8ff');
  for(const b of bullets){ctx.drawImage(bg,b.x-12,b.y-22,24,44);ctx.fillStyle='#eaffff';pill(ctx,b.x-2.5,b.y-11,5,22);ctx.fill();}
  // partículas
  for(const q of parts){const a=q.life/q.max;
    if(q.t==='s'){ctx.globalAlpha=a;const s=q.size*(.5+a*.5);ctx.drawImage(glowSpr(q.col),q.x-s,q.y-s,s*2,s*2);}
    else if(q.t==='r'){ctx.globalAlpha=a;ctx.strokeStyle=q.col;ctx.lineWidth=3*a+1;ctx.beginPath();ctx.arc(q.x,q.y,q.size*(1-a)+6,0,7);ctx.stroke();}
    else{ctx.globalAlpha=a*.9;const s=q.size*(1.2-a*.4);ctx.drawImage(glowSpr('#ffffff'),q.x-s,q.y-s,s*2,s*2);}}
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  if(state!=='menu') drawPlayer();
  // textos flotantes
  ctx.textAlign='center';ctx.font='700 13px "Chakra Petch",sans-serif';
  for(const t of texts){ctx.globalAlpha=Math.min(1,t.life*1.5);ctx.fillStyle=t.col;ctx.fillText(t.txt,t.x,t.y);}
  ctx.globalAlpha=1;
  ctx.setTransform(DPR*scale,0,0,DPR*scale,0,0);
  drawVignette();
}
let last=performance.now(), lastDt=0;
function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;lastDt=(state==='play'||state==='menu'||state==='dying'||state==='ending')?dt:dt*.15;update(dt);render();requestAnimationFrame(loop);}

scr.addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(!b||b.disabled)return;SFX.init();const a=b.dataset.a,v=+b.dataset.v;

let curQ=null;
function openQuiz(){
  if(state!=='play')return;
  if(G.correct>=10){toast('Ya respondiste las 10 preguntas. ¡Gasta tus balas!');return;}
  state='quiz';fireHeld=false;$('bFire').classList.remove('down');$('bReload').classList.remove('urge');
  const id=G.queue[0], q=PHASES[G.phase].qs[id];
  const order=shuffle([0,1,2,3]);curQ={id,q,order,done:false};
  $('qTag').textContent=`Recarga · Fase ${G.phase+1}`;
  $('qCount').textContent=`Correctas ${G.correct}/10`;
  $('qTopic').textContent=PHASES[G.phase].topic+(G.wrongIds.has(id)?' · Pregunta repetida':'');
  $('qText').textContent=q.t;
  const fig=$('qFig');if(q.f){fig.innerHTML=FIG[q.f]();fig.hidden=false;}else{fig.innerHTML='';fig.hidden=true;}
  $('qOpts').innerHTML=order.map((oi,k)=>`<button class="opt" data-o="${oi}"><span class="k">${'ABCD'[k]}</span><span>${q.o[oi]}</span></button>`).join('');
  $('qFb').hidden=true;$('qNext').hidden=true;
  $('quiz').hidden=false;$('quiz').querySelector('.card').scrollTop=0;
}
$('qOpts').addEventListener('click',ev=>{const b=ev.target.closest('.opt');if(b)answer(+b.dataset.o);});
function answer(oi){
  if(!curQ||curQ.done)return;curQ.done=true;const ok=oi===0,q=curQ.q;
  $('qOpts').querySelectorAll('.opt').forEach(b=>{const o=+b.dataset.o;b.disabled=true;if(o===0)b.classList.add('ok');else if(o===oi)b.classList.add('bad');else b.classList.add('dim');});
  const fb=$('qFb');fb.hidden=false;
  if(ok){G.queue.shift();G.correct++;G.ammo+=15;G.hp=Math.min(100,G.hp+10);G.score+=500;SFX.ok();
    fb.className='fb ok';fb.innerHTML=`<strong>¡Correcto! +15 balas · +10 membrana</strong>${q.e}`;
    $('qNext').textContent=G.correct>=10?'¡10/10! Volver a disparar':'Volver a disparar';}
  else{G.queue.push(G.queue.shift());G.wrongIds.add(curQ.id);G.wrongPhase++;SFX.bad();
    fb.className='fb bad';fb.innerHTML=`<strong>Incorrecto. La respuesta era: ${q.o[0]}</strong>${q.e} <em>Esta pregunta volverá más adelante.</em>`;
    $('qNext').textContent=G.ammo>0?'Volver al juego':'Intentar otra pregunta';}
  $('qCount').textContent=`Correctas ${G.correct}/10`;
  hud();$('qNext').hidden=false;$('qNext').focus({preventScroll:true});
  setTimeout(()=>{const c=$('quiz').querySelector('.card');c.scrollTo({top:c.scrollHeight,behavior:'smooth'});},60);
}
$('qNext').addEventListener('click',()=>{
  $('quiz').hidden=true;state='play';last=performance.now();
  if(G.ammo<=0&&G.correct<10){openQuiz();return;}
  if(G.correct>=10&&!G.finalNotice){G.finalNotice=true;toast('¡10/10! Usa tus últimas balas: la fase termina cuando se agoten',2800);}
  else toast(`+15 balas · Correctas ${G.correct}/10`,1300);
});

const keys={};
addEventListener('keydown',e=>{

addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;fireHeld=false;});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});

// arrastre relativo en cualquier parte de la pantalla
let drag=null;
cv.addEventListener('pointerdown',e=>{SFX.init();if(state!=='play'||!player)return;drag={id:e.pointerId,x:e.clientX,y:e.clientY};try{cv.setPointerCapture(e.pointerId);}catch(_){}});
cv.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId||state!=='play')return;const k=1.35/scale;
  player.x=clamp(player.x+(e.clientX-drag.x)*k,PX0+22,PX0+PW-22);player.y=clamp(player.y+(e.clientY-drag.y)*k,H*.3,maxY());drag.x=e.clientX;drag.y=e.clientY;});
const endDrag=e=>{if(drag&&drag.id===e.pointerId)drag=null;};
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
const fb=$('bFire');
fb.addEventListener('pointerdown',e=>{e.preventDefault();SFX.init();fireHeld=true;fb.classList.add('down');try{fb.setPointerCapture(e.pointerId);}catch(_){}});
['pointerup','pointercancel','lostpointercapture'].forEach(t=>fb.addEventListener(t,()=>{fireHeld=false;fb.classList.remove('down');}));
fb.addEventListener('contextmenu',e=>e.preventDefault());
$('bReload').addEventListener('click',()=>{SFX.init();openQuiz();});
$('bPause').addEventListener('click',()=>pause());
const muteIcon=()=>{$('bMute').innerHTML=SFX.on?'<svg viewBox="0 0 24 24" fill="none" stroke="#e8f4ff" stroke-width="2" stroke-linecap="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#e8f4ff"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="#e8f4ff" stroke-width="2" stroke-linecap="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#e8f4ff"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';};
$('bMute').addEventListener('click',()=>{SFX.on=!SFX.on;store.set('cm_sound',SFX.on);muteIcon();});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());

/* =========================================================
   INICIO
   ========================================================= */
SFX.on=store.get('cm_sound',true);muteIcon();
buildSprites();resize();addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,200));
menu();requestAnimationFrame(loop);
</script>
</body>
</html>
